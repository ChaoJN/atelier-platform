<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://img.icons8.com/?size=100&id=hRlGryuq38s4&format=png&color=000000" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainstopha Select - 前台會員登入</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #333; min-height: 100svh; display: flex; flex-direction: column; }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 24px;
            height: 56px;
        }
        .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            grid-column: 2;
            text-align: center;
            color: #333;
        }
        .hamburger {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #333;
            border-radius: 2px;
            transition: all 0.3s;
        }

        /* ── 遮罩 ── */
        .menu-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: -200px;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .menu-overlay.open { opacity: 1; pointer-events: auto; }

        /* ── 側邊選單 ── */
        .menu-panel {
            position: fixed;
            top: 0; left: 0;
            bottom: -200px;
            width: 260px;
            background: #fff;
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 24px 0;
        }
        .menu-panel.open { transform: translateX(0); }
        .menu-close {
            align-self: flex-end;
            margin-right: 20px;
            margin-bottom: 16px;
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #555;
        }
        .menu-nav a {
            display: block;
            padding: 14px 28px;
            font-size: 15px;
            color: #333;
            text-decoration: none;
            transition: background 0.15s;
        }
        .menu-nav a:hover { background: #f7f7f7; }
        .menu-nav-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 28px;
            font-size: 15px;
            color: #333;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: background 0.15s;
        }
        .menu-nav-toggle:hover { background: #f7f7f7; }
        .menu-subnav { display: none; background: #fafafa; }
        .menu-subnav.open { display: block; }
        .menu-subnav a {
            padding: 10px 28px 10px 40px;
            font-size: 14px;
            color: #555;
        }
        .menu-search {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .menu-search input {
            width: 100%;
            padding: 8px 4px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ccc;
            color: #ccc;
        }
        .menu-search input::placeholder { color: #ccc; }
        .menu-search input:focus { border-bottom-color: #333; color: #333; }

        /* ── 登入表單 ── */
        .login-wrap {
            max-width: 400px;
            margin: 0 auto;
            padding: 48px 24px 80px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #333; font-size: 20px; text-align: center; }
        p { color: #666; font-size: 14px; text-align: center; line-height: 1.5; }
        input, button { font-family: inherit; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px; /* 手機端大於 16px 才不會觸發 iOS 自動放大畫面的 bug */
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background: #000; }
        .tips {
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
        .tips.error { background-color: #fdf0f0; color: #cc0000; border-left: 3px solid #cc0000; }
        .tips.success { background-color: #f0f9f1; color: #1a7f37; border-left: 3px solid #1a7f37; }
        label {
            font-size: 13px;
            color: #666;
            cursor: pointer;
            display: inline;
            vertical-align: middle;
        }
        input[type="checkbox"] {
            width: auto;
            vertical-align: middle;
        }
        .site-footer { text-align: center; padding: 20px 0; font-size: 11px; color: #aaa; margin-top: auto; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 12px; padding: 28px 24px; max-width: 300px; width: 100%; margin: 0 20px; box-sizing: border-box; text-align: center; }
        .modal-msg { margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #333; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 8px 24px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #333; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; transition: background 0.2s, color 0.2s; }
        .modal-btn:hover { background: #333; color: #fff; }
        .modal-btn.danger { border-color: #cc0000; color: #cc0000; }
        .modal-btn.danger:hover { background: #cc0000; color: #fff; }
    </style>
</head>
<body>

    <!-- 遮罩 -->
    <div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>

    <!-- 側邊選單 -->
    <div class="menu-panel" id="menu-panel">
        <button class="menu-close" onclick="closeMenu()">✕</button>
        <div class="menu-search">
            <input type="text" id="menu-search-input" placeholder="ＳＥＡＲＣＨ . . ." autocomplete="off"
                onkeydown="if(event.key==='Enter') searchProducts(this.value)">
            <button style="background:transparent; border:none; cursor:pointer; padding:0;" onclick="searchProducts(document.getElementById('menu-search-input').value)">
                <img src="https://img.icons8.com/?size=100&id=lwZinoeNcL3F&format=png&color=000000" width="20" height="20" style="flex-shrink:0;">
            </button>
        </div>
        <nav class="menu-nav">
            <div>
                <button class="menu-nav-toggle" onclick="toggleSubnav(this)">SHOP</button>
                <div class="menu-subnav" id="subnav-shop">
                    <a href="/product">ALL</a>
                </div>
            </div>
            <a id="auth-link" href="/login">LOGIN</a>
            <a href="https://www.instagram.com/rainstopha.select" target="_blank" rel="noopener">CONTACT US</a>
        </nav>
    </div>

    <!-- Header -->
    <header>
        <button class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="logo" onclick="location.href='/index'">Rainstopha Select</div>
        <div style="display:flex; justify-content:flex-end;">
            <button onclick="location.href='/cart'" style="background:transparent; border:none; cursor:pointer; padding:4px; display:flex; align-items:center;">
                <img src="https://img.icons8.com/?size=100&id=eozCw7Tm2VN8&format=png&color=000000" width="22" height="22">
            </button>
        </div>
    </header>

    <div class="login-wrap">
        <h2><img src="https://img.icons8.com/?size=100&id=2S1zt7gTwjS7&format=png&color=000000" width="60" height="60" style="vertical-align: middle; margin-right: 5px;">會員登入 / 註冊</h2>
        <!-- 步驟一：輸入 Email -->
        <div id="email-section">
            <label for="email-input" style="color: #333;">電子郵件</label>
            <input type="email" id="email-input" placeholder="example@mail.com">
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">我同意新用戶自動註冊或舊用戶登入</label>
            </div>
            <button onclick="sendMemberOtp()">獲取驗證碼</button>
            <div id="otp-countdown" style="display: none; margin: 10px 0; font-size: 13px; color: #555;"></div>
        </div>

        <!-- 步驟二：輸入驗證碼（預設隱藏） -->
        <div id="otp-section" style="display:none; margin-top: 20px;">
            <input type="text" id="otp-input" placeholder="請輸入 8 位數驗證碼" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter') verifyOtp()">
            <button onclick="verifyOtp()">確認登入</button>
        </div>

        <!-- 步驟三：新用戶設定暱稱（預設隱藏） -->
        <div id="name-section" style="display:none; margin-top: 20px;">
            <p style="margin-bottom: 8px; color: #333;">歡迎加入！請設定您的暱稱</p>
            <input type="text" id="name-input" placeholder="暱稱（可稍後在帳號頁修改）" maxlength="20">
            <button onclick="saveNameAndRedirect()">完成，進入網站</button>
            <button onclick="skipName()" style="background: transparent; color: #888; font-weight: normal; margin-top: 4px; border: 1px solid #ddd;">略過</button>
        </div>

        <div id="tips" class="tips"></div>
    </div>

    <script>
        let currentEmail = '';
        let isCounting = false;

        function showTips(message, type = 'error') {
            const tips = document.getElementById('tips');
            tips.textContent = message;
            tips.className = 'tips ' + type;
            tips.style.display = 'block';
        }

        async function sendMemberOtp() {
            if (isCounting) return showTips('請稍後再試...');
            currentEmail = document.getElementById('email-input').value;
            if (!currentEmail) return showTips('請先輸入 Email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(currentEmail)) return showTips('請輸入有效的 Email 格式');
            if (!document.getElementById('agree').checked) return showTips('請同意新用戶自動註冊或舊用戶登入');

            const res = await fetch('/api/auth/member-send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail })
            });
            const data = await res.json();

            if (res.ok) {
                showTips(data.message, 'success');
                document.getElementById('otp-section').style.display = 'block';
                document.getElementById('otp-countdown').style.display = 'block';
                startCountdown();
            } else {
                showTips(data.error);
            }
        }

        function startCountdown() {
            const otp_countdown = document.getElementById('otp-countdown');
            let seconds = 60;
            isCounting = true;
            otp_countdown.textContent = `${seconds} 秒後可再次獲取驗證碼`;

            const timer = setInterval(() => {
                seconds--;
                otp_countdown.textContent = `${seconds} 秒後可再次獲取驗證碼`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    isCounting = false;
                    otp_countdown.textContent = '可再次點擊發送驗證信囉！';
                }
            }, 1000);
        }

        let isVerifying = false;

        async function verifyOtp() {
            if (isVerifying) return;
            const token = document.getElementById('otp-input').value;
            if (!token) return showTips('請輸入驗證碼');

            isVerifying = true;
            const btn = document.querySelector('#otp-section button');
            btn.disabled = true;

            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail, token: token })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('user_token', data.token);
                if (!data.user.name) {
                    showTips('驗證成功！請設定您的暱稱', 'success');
                    document.getElementById('otp-section').style.display = 'none';
                    document.getElementById('name-section').style.display = 'block';
                    document.getElementById('name-input').focus();
                } else {
                    showTips('登入成功！正在跳轉...', 'success');
                    doRedirect();
                }
            } else {
                showTips(data.error);
                isVerifying = false;
                btn.disabled = false;
            }
        }

        async function saveNameAndRedirect() {
            const name = document.getElementById('name-input').value.trim();
            if (!name) return showTips('請輸入暱稱');
            const token = localStorage.getItem('user_token');
            const res = await fetch('/api/members/me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ display_name: name })
            });
            const data = await res.json();
            if (!res.ok) return showTips(data.error || '儲存失敗，請稍後再試');
            doRedirect();
        }

        function skipName() {
            doRedirect();
        }

        function doRedirect() {
            const redirect = localStorage.getItem('redirect_after_login') || '/index';
            localStorage.removeItem('redirect_after_login');
            window.location.href = redirect;
        }

        /* ── 選單控制 ── */
        function toggleMenu() {
            const panel = document.getElementById('menu-panel');
            const overlay = document.getElementById('menu-overlay');
            const isOpening = !panel.classList.contains('open');
            if (isOpening) {
                const h = Math.max(window.innerHeight, screen.height) + 200;
                panel.style.height = h + 'px';
                overlay.style.height = h + 'px';
            }
            panel.classList.toggle('open');
            overlay.classList.toggle('open');
        }
        function closeMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            document.getElementById('menu-overlay').classList.remove('open');
        }
        function toggleSubnav(btn) {
            btn.classList.toggle('open');
            btn.nextElementSibling.classList.toggle('open');
        }
        function searchProducts(keyword) {
            if (!keyword.trim()) return;
            location.href = `/product.html?keyword=${encodeURIComponent(keyword.trim())}`;
        }

        /* ── 載入側邊選單分類 ── */
        async function loadMenuCategories() {
            const res = await fetch('/api/categories');
            if (!res.ok) return;
            const { data } = await res.json();
            const subnav = document.getElementById('subnav-shop');
            data.forEach(c => {
                const a = document.createElement('a');
                a.href = `/product.html?category=${c.id}`;
                a.textContent = c.slug.toUpperCase();
                subnav.appendChild(a);
            });
        }

        function closeConfirm() { document.getElementById('confirm-modal').classList.remove('show'); }
        function showConfirm(msg, confirmText = '確認', isDanger = false) {
            return new Promise(resolve => {
                document.getElementById('confirm-msg').textContent = msg;
                document.getElementById('confirm-actions').innerHTML = `
                    <button class="modal-btn" id="confirm-cancel">取消</button>
                    <button class="modal-btn${isDanger ? ' danger' : ''}" id="confirm-ok">${confirmText}</button>`;
                document.getElementById('confirm-ok').onclick = () => { closeConfirm(); resolve(true); };
                document.getElementById('confirm-cancel').onclick = () => { closeConfirm(); resolve(false); };
                document.getElementById('confirm-modal').classList.add('show');
            });
        }

        /* ── 已登入顯示 LOGOUT / ACCOUNT ── */
        if (localStorage.getItem('user_token')) {
            const link = document.getElementById('auth-link');
            const accountLink = document.createElement('a');
            accountLink.href = '/account';
            accountLink.textContent = 'ACCOUNT';
            link.insertAdjacentElement('beforebegin', accountLink);
            link.textContent = 'LOGOUT';
            link.removeAttribute('href');
            link.onclick = async () => {
                const ok = await showConfirm('確定要登出嗎？', '登出', true);
                if (ok) { localStorage.removeItem('user_token'); location.href = '/index'; }
            };
        }

        loadMenuCategories();
    </script>

    <footer class="site-footer">
        <div style="margin-bottom: 4px;">
            <a href="/policy" style="color: #aaa; text-decoration: underline; font-size: 11px; letter-spacing: 0.5px;">購物須知</a>
        </div>
        Copyright © 2026 Rainstopha Select
    </footer>
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <p class="modal-msg" id="confirm-msg"></p>
            <div class="modal-actions" id="confirm-actions"></div>
        </div>
    </div>
</body>
</html>
